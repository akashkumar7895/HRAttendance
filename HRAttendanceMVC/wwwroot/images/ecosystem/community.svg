<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="comm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="comm-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="comm-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="comm-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="comm-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="comm-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="85" r="68" fill="url(#comm-bg)" />
  <circle cx="50" cy="50" r="16" fill="#fef3c7" opacity="0.6" />

  <!-- Network Connection Lines -->
  <path d="M72 105 L120 62 L168 105 Z" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="4,4" fill="none" />
  <circle cx="96" cy="84" r="3.5" fill="#10b981" opacity="0.6" />
  <circle cx="144" cy="84" r="3.5" fill="#6366f1" opacity="0.6" />
  <circle cx="120" cy="105" r="3.5" fill="#8b5cf6" opacity="0.6" />

  <!-- Avatar 1: Center Leader (Top) -->
  <g transform="translate(120, 60)" filter="url(#comm-shadow)">
    <!-- Base card circle -->
    <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#e0e7ff" stroke-width="2.5" />
    <circle cx="0" cy="0" r="21" fill="url(#comm-purple)" />
    <!-- Person Head -->
    <circle cx="0" cy="-6" r="8" fill="#fde68a" />
    <!-- Hair -->
    <path d="M-8 -9 C-8 -15 8 -15 8 -9 C8 -6 7 -4 5 -4 C3 -6 -3 -6 -5 -4 C-7 -4 -8 -6 -8 -9 Z" fill="#312e81" />
    <!-- Body -->
    <path d="M-14 16 C-14 8 -8 4 0 4 C8 4 14 8 14 16 Z" fill="#ffffff" />
    <polygon points="-3,5 3,5 0,11" fill="#f59e0b" />
  </g>

  <!-- Avatar 2: Left Professional -->
  <g transform="translate(70, 108)" filter="url(#comm-shadow)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#d1fae5" stroke-width="2.5" />
    <circle cx="0" cy="0" r="19" fill="url(#comm-mint)" />
    <!-- Head -->
    <circle cx="0" cy="-5" r="7.5" fill="#fbcfe8" />
    <!-- Hair bun -->
    <circle cx="0" cy="-12" r="4" fill="#831843" />
    <path d="M-7 -6 C-7 -12 7 -12 7 -6 C7 -4 5 -3 4 -3 C2 -5 -2 -5 -4 -3 C-6 -3 -7 -4 -7 -6 Z" fill="#831843" />
    <!-- Body -->
    <path d="M-12 14 C-12 7 -6 4 0 4 C6 4 12 7 12 14 Z" fill="#ffffff" />
    <circle cx="0" cy="8" r="2" fill="#047857" />
  </g>

  <!-- Avatar 3: Right Professional -->
  <g transform="translate(170, 108)" filter="url(#comm-shadow)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#e0e7ff" stroke-width="2.5" />
    <circle cx="0" cy="0" r="19" fill="url(#comm-indigo)" />
    <!-- Head -->
    <circle cx="0" cy="-5" r="7.5" fill="#fed7aa" />
    <!-- Hair -->
    <path d="M-7 -7 C-7 -13 7 -13 7 -7 C7 -4 4 -4 3 -4 C1 -6 -1 -6 -3 -4 C-5 -4 -7 -4 -7 -7 Z" fill="#1e293b" />
    <!-- Glasses -->
    <rect x="-6" y="-6" width="5" height="3.5" rx="1" fill="none" stroke="#ffffff" stroke-width="1" />
    <rect x="1" y="-6" width="5" height="3.5" rx="1" fill="none" stroke="#ffffff" stroke-width="1" />
    <line x1="-1" y1="-4.5" x2="1" y2="-4.5" stroke="#ffffff" stroke-width="1" />
    <!-- Body -->
    <path d="M-12 14 C-12 7 -6 4 0 4 C6 4 12 7 12 14 Z" fill="#ffffff" />
    <polygon points="-2,5 2,5 0,10" fill="#dc2626" />
  </g>

  <!-- Speech Bubble 1: Solution / Lightbulb (top-right) -->
  <g transform="translate(162, 28)" filter="url(#comm-shadow)">
    <rect x="0" y="0" width="38" height="26" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <polygon points="10,26 16,26 12,31" fill="#ffffff" />
    <!-- Mini Idea Bulb -->
    <circle cx="19" cy="11" r="5" fill="url(#comm-amber)" />
    <rect x="17" y="16" width="4" height="2" rx="0.5" fill="#b45309" />
    <line x1="19" y1="3" x2="19" y2="4.5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="12" y1="8" x2="13.5" y2="9" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="26" y1="8" x2="24.5" y2="9" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Speech Bubble 2: Collaboration / Heart Reaction (left) -->
  <g transform="translate(36, 64)" filter="url(#comm-shadow)">
    <rect x="0" y="0" width="32" height="24" rx="7" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5" />
    <polygon points="20,24 26,24 24,28" fill="#ffffff" />
    <!-- Heart Icon -->
    <path d="M16 17 C16 17 9 12.5 9 8.5 C9 6.5 10.5 5 12.5 5 C14 5 15.2 6 16 7 C16.8 6 18 5 19.5 5 C21.5 5 23 6.5 23 8.5 C23 12.5 16 17 16 17 Z" fill="#ec4899" />
  </g>

  <!-- Community Badge in center -->
  <g transform="translate(108, 93)">
    <circle cx="12" cy="12" r="11" fill="#ffffff" filter="url(#comm-shadow)" />
    <circle cx="12" cy="12" r="8" fill="#10b981" />
    <path d="M9 12 L11 14 L15 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Sparkles / Confetti -->
  <path d="M42 34 Q44 38 48 39 Q44 41 42 45 Q40 41 36 39 Q40 38 42 34 Z" fill="#10b981" />
  <circle cx="204" cy="74" r="3" fill="#8b5cf6" opacity="0.7" />
  <circle cx="215" cy="122" r="2.5" fill="#10b981" opacity="0.6" />
</svg>
