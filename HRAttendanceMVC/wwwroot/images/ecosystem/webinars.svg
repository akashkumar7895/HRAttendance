<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="web-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="web-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="web-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="web-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="web-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="web-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#451a03" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="85" r="68" fill="url(#web-bg)" />
  <circle cx="55" cy="45" r="16" fill="#fce7f3" opacity="0.6" />

  <!-- Base Shadow -->
  <ellipse cx="120" cy="138" rx="65" ry="6" fill="#0f172a" opacity="0.12" />

  <!-- Monitor Stand Base & Stem -->
  <path d="M100 134 L140 134 C142 134 144 132 143 130 L138 126 L102 126 L97 130 C96 132 98 134 100 134 Z" fill="#334155" />
  <rect x="114" y="112" width="12" height="16" rx="2" fill="#475569" />

  <!-- Monitor Frame & Screen -->
  <g filter="url(#web-shadow)">
    <!-- Outer Bezel -->
    <rect x="52" y="38" width="136" height="84" rx="8" fill="#1e293b" />
    <!-- Web Camera dot -->
    <circle cx="120" cy="42.5" r="1.5" fill="#64748b" />
    <!-- Inner Screen -->
    <rect x="57" y="46" width="126" height="71" rx="5" fill="url(#web-screen)" />

    <!-- Screen UI: Webinar Split View -->
    <!-- Left: Main Keynote Speaker Video Window -->
    <rect x="62" y="51" width="62" height="48" rx="4" fill="#312e81" stroke="#4338ca" stroke-width="1" />
    <!-- Presenter Avatar -->
    <circle cx="93" cy="68" r="8" fill="#fde68a" />
    <path d="M85 64 C85 58 101 58 101 64 C101 66 100 68 98 68 C96 66 90 66 88 68 C86 68 85 66 85 64 Z" fill="#1e1b4b" />
    <path d="M79 88 C79 80 85 76 93 76 C101 76 107 80 107 88 Z" fill="url(#web-purple)" />
    <!-- Speaker Mic indicator -->
    <circle cx="118" cy="56" r="3" fill="#22c55e" />

    <!-- Right: Presentation Slides / Charts Window -->
    <rect x="128" y="51" width="50" height="48" rx="4" fill="#ffffff" />
    <!-- Slide Header -->
    <rect x="133" y="55" width="22" height="3" rx="1.5" fill="#6366f1" />
    <!-- Mini Bar Chart on slide -->
    <rect x="133" y="78" width="5" height="12" rx="1" fill="#818cf8" />
    <rect x="141" y="72" width="5" height="18" rx="1" fill="#a855f7" />
    <rect x="149" y="66" width="5" height="24" rx="1" fill="#ec4899" />
    <rect x="157" y="62" width="5" height="28" rx="1" fill="#f59e0b" />
    <rect x="165" y="70" width="5" height="20" rx="1" fill="#10b981" />

    <!-- Bottom: Participant Thumbnails Bar -->
    <g transform="translate(62, 102)">
      <circle cx="6" cy="7" r="5" fill="#4338ca" />
      <circle cx="6" cy="5" r="2.5" fill="#fed7aa" />
      <circle cx="20" cy="7" r="5" fill="#047857" />
      <circle cx="20" cy="5" r="2.5" fill="#fbcfe8" />
      <circle cx="34" cy="7" r="5" fill="#b45309" />
      <circle cx="34" cy="5" r="2.5" fill="#fde68a" />
      <rect x="44" y="4" width="22" height="6" rx="3" fill="#475569" />
      <!-- Mic mute/video icons -->
      <circle cx="116" cy="7" r="4" fill="#ef4444" />
      <circle cx="106" cy="7" r="4" fill="#3b82f6" />
    </g>
  </g>

  <!-- "LIVE" Red Streaming Pill (top-left) -->
  <g transform="translate(36, 26)" filter="url(#web-shadow)">
    <rect x="0" y="0" width="48" height="20" rx="10" fill="#ef4444" />
    <circle cx="10" cy="10" r="3.5" fill="#ffffff" />
    <rect x="18" y="8" width="22" height="4" rx="1.5" fill="#ffffff" />
  </g>

  <!-- Interactive Q&A Bubble (floating top-right) -->
  <g transform="translate(172, 22)" filter="url(#web-shadow)">
    <rect x="0" y="0" width="38" height="28" rx="9" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <polygon points="12,28 18,28 14,33" fill="#ffffff" />
    <!-- "Q&A" or "?" symbol -->
    <circle cx="19" cy="14" r="8" fill="url(#web-gold)" />
    <!-- Question mark -->
    <text x="19" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
  </g>

  <!-- Sparkles -->
  <path d="M210 82 Q212 86 216 87 Q212 88 210 92 Q208 88 204 87 Q208 86 210 82 Z" fill="#f59e0b" />
  <circle cx="32" cy="102" r="3" fill="#8b5cf6" opacity="0.6" />
  <circle cx="218" cy="116" r="2.5" fill="#38bdf8" opacity="0.6" />
</svg>
