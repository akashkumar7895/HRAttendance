<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="comp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="comp-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="comp-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="comp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="comp-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="comp-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="85" r="68" fill="url(#comp-bg)" />
  <circle cx="50" cy="45" r="16" fill="#fef3c7" opacity="0.6" />

  <!-- Base Shadow -->
  <ellipse cx="120" cy="135" rx="65" ry="6" fill="#0f172a" opacity="0.1" />

  <!-- Statutory / Law Book (left background) -->
  <g transform="translate(46, 52) rotate(-8)" filter="url(#comp-shadow)">
    <!-- Book Spine & Cover -->
    <rect x="0" y="0" width="56" height="74" rx="4" fill="url(#comp-navy)" />
    <!-- Book Pages -->
    <rect x="5" y="3" width="50" height="68" rx="2" fill="#f8fafc" />
    <!-- Cover Accent -->
    <rect x="0" y="0" width="8" height="74" rx="2" fill="#334155" />
    <!-- Gold Scales of Justice Emblem on Cover -->
    <circle cx="28" cy="24" r="10" fill="#fef3c7" stroke="url(#comp-gold)" stroke-width="1.5" />
    <!-- Scale icon -->
    <line x1="28" y1="18" x2="28" y2="30" stroke="#d97706" stroke-width="1.5" />
    <line x1="22" y1="21" x2="34" y2="21" stroke="#d97706" stroke-width="1.5" />
    <polygon points="20,27 24,27 22,23" fill="#d97706" />
    <polygon points="32,27 36,27 34,23" fill="#d97706" />
    <!-- Lines on Page -->
    <rect x="14" y="40" width="34" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="14" y="47" width="28" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="14" y="54" width="32" height="3" rx="1.5" fill="#cbd5e1" />
    <!-- Gold Bookmark Ribbon -->
    <polygon points="26,0 32,0 32,18 29,15 26,18" fill="url(#comp-gold)" />
  </g>

  <!-- Statutory Checklist Clipboard (right background) -->
  <g transform="translate(132, 44) rotate(6)" filter="url(#comp-shadow)">
    <!-- Board -->
    <rect x="0" y="0" width="64" height="82" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Metal Clip -->
    <rect x="20" y="-5" width="24" height="9" rx="3" fill="#64748b" />
    <circle cx="32" cy="-1" r="2" fill="#cbd5e1" />
    <!-- Title -->
    <rect x="8" y="12" width="28" height="4" rx="2" fill="#047857" />
    <!-- Check items: PF, ESI, PT, LWF -->
    <!-- PF -->
    <circle cx="14" cy="26" r="4" fill="#d1fae5" />
    <path d="M12 26 L13.5 27.5 L16.5 24.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <rect x="22" y="24" width="34" height="4" rx="2" fill="#334155" />

    <!-- ESI -->
    <circle cx="14" cy="38" r="4" fill="#d1fae5" />
    <path d="M12 38 L13.5 39.5 L16.5 36.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <rect x="22" y="36" width="28" height="4" rx="2" fill="#334155" />

    <!-- PT -->
    <circle cx="14" cy="50" r="4" fill="#d1fae5" />
    <path d="M12 50 L13.5 51.5 L16.5 48.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <rect x="22" y="48" width="32" height="4" rx="2" fill="#334155" />

    <!-- LWF -->
    <circle cx="14" cy="62" r="4" fill="#d1fae5" />
    <path d="M12 62 L13.5 63.5 L16.5 60.5" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <rect x="22" y="60" width="26" height="4" rx="2" fill="#334155" />
  </g>

  <!-- Big Central Compliance Shield -->
  <g transform="translate(120, 78)" filter="url(#comp-shadow)">
    <!-- Outer Shield Border -->
    <path d="M0 -34 C20 -34 32 -26 32 -10 C32 18 16 34 0 42 C-16 34 -32 18 -32 -10 C-32 -26 -20 -34 0 -34 Z" fill="#ffffff" />
    <!-- Inner Shield Gradient -->
    <path d="M0 -30 C18 -30 28 -23 28 -8 C28 16 14 30 0 38 C-14 30 -28 16 -28 -8 C-28 -23 -18 -30 0 -30 Z" fill="url(#comp-shield)" />
    <!-- Shield Highlight Arc -->
    <path d="M0 -26 C15 -26 24 -20 24 -7 C24 13 12 25 0 32" stroke="#6ee7b7" stroke-width="2" fill="none" opacity="0.6" />
    <!-- Verified Checkmark -->
    <path d="M-10 -1 L-3 6 L12 -9" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Monthly Update Pill / Badge (top-right) -->
  <g transform="translate(160, 24)" filter="url(#comp-shadow)">
    <rect x="0" y="0" width="46" height="18" rx="9" fill="url(#comp-purple)" />
    <!-- Refresh / Circular arrows -->
    <path d="M11 9 A3.5 3.5 0 1 1 14 11 M14 8 L14 11 L11 11" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Text bar -->
    <rect x="18" y="7.5" width="20" height="3" rx="1.5" fill="#ffffff" />
  </g>

  <!-- Sparkles -->
  <path d="M42 32 Q44 36 48 37 Q44 38 42 42 Q40 38 36 37 Q40 36 42 32 Z" fill="#10b981" />
  <circle cx="206" cy="98" r="3" fill="#f59e0b" opacity="0.7" />
  <circle cx="34" cy="116" r="2.5" fill="#8b5cf6" opacity="0.6" />
</svg>
