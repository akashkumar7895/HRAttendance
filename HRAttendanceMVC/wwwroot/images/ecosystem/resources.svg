<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="res-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
    <linearGradient id="res-folder-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="res-folder-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="res-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="res-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="res-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0369a1" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="85" r="68" fill="url(#res-bg)" />
  <circle cx="180" cy="40" r="15" fill="#fef08a" opacity="0.6" />

  <!-- Base Drop Shadow -->
  <ellipse cx="120" cy="136" rx="66" ry="6" fill="#0f172a" opacity="0.1" />

  <!-- Folder Back Cover & Tab -->
  <g filter="url(#res-shadow)">
    <path d="M50 62 C50 58 53 55 57 55 L90 55 L99 64 L183 64 C187 64 190 67 190 71 L190 125 C190 129 187 132 183 132 L57 132 C53 132 50 129 50 125 Z" fill="url(#res-folder-back)" />
  </g>

  <!-- Document 3: Backmost (HR Guide / Handbook) -->
  <g transform="translate(68, 38) rotate(-6)" filter="url(#res-shadow)">
    <rect x="0" y="0" width="56" height="74" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="56" height="14" rx="4" fill="#9333ea" />
    <rect x="8" y="5" width="24" height="4" rx="2" fill="#ffffff" opacity="0.9" />
    <!-- Content Lines -->
    <rect x="8" y="22" width="40" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="8" y="29" width="34" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="8" y="36" width="38" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="8" y="43" width="28" height="3" rx="1.5" fill="#cbd5e1" />
    <!-- Bookmark Ribbon -->
    <polygon points="44,0 52,0 52,20 48,16 44,20" fill="url(#res-orange)" />
  </g>

  <!-- Document 2: Middle (Offer Letter / Agreement) -->
  <g transform="translate(112, 34) rotate(5)" filter="url(#res-shadow)">
    <rect x="0" y="0" width="58" height="76" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Header bar -->
    <rect x="8" y="8" width="22" height="5" rx="2" fill="#0284c7" />
    <!-- Text Lines -->
    <rect x="8" y="19" width="42" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="8" y="26" width="36" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="8" y="33" width="40" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="8" y="40" width="30" height="3" rx="1.5" fill="#cbd5e1" />
    <!-- Signature Line -->
    <line x1="8" y1="56" x2="34" y2="56" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <!-- Official Stamp / Seal -->
    <circle cx="44" cy="54" r="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
    <path d="M41 54 L43 56 L47 52" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Document 1: Frontmost Center (Policy Template) -->
  <g transform="translate(86, 44)" filter="url(#res-shadow)">
    <rect x="0" y="0" width="68" height="78" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <rect x="8" y="8" width="26" height="5" rx="2" fill="#0284c7" />
    <rect x="38" y="8" width="18" height="5" rx="2" fill="#38bdf8" opacity="0.6" />
    <!-- Checklist items with checkmarks -->
    <circle cx="12" cy="22" r="3" fill="#10b981" />
    <rect x="19" y="20.5" width="38" height="3" rx="1.5" fill="#64748b" />
    <circle cx="12" cy="31" r="3" fill="#10b981" />
    <rect x="19" y="29.5" width="32" height="3" rx="1.5" fill="#64748b" />
    <circle cx="12" cy="40" r="3" fill="#10b981" />
    <rect x="19" y="38.5" width="36" height="3" rx="1.5" fill="#64748b" />
    <rect x="19" y="47.5" width="28" height="3" rx="1.5" fill="#cbd5e1" />
  </g>

  <!-- Folder Front Flap (Pockets forward) -->
  <g filter="url(#res-shadow)">
    <path d="M46 84 C46 80 49 77 53 77 L105 77 L116 86 L187 86 C191 86 194 89 194 93 L194 126 C194 130 191 133 187 133 L53 133 C49 133 46 130 46 126 Z" fill="url(#res-folder-front)" opacity="0.96" />
  </g>

  <!-- Floating Download Badge (bottom-right) -->
  <g transform="translate(170, 92)" filter="url(#res-shadow)">
    <circle cx="16" cy="16" r="16" fill="url(#res-purple)" />
    <!-- Download Arrow -->
    <path d="M16 9 L16 20 M11 16 L16 21 L21 16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="10" y1="24" x2="22" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Paperclip (top-left) -->
  <path d="M42 45 C40 40 45 35 50 38 L57 44 C61 47 57 53 53 50 L46 45 C43 43 45 40 47 42 L52 46" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Sparkles / Floating Dots -->
  <path d="M204 36 Q206 40 210 41 Q206 42 204 46 Q202 42 198 41 Q202 40 204 36 Z" fill="#0284c7" />
  <circle cx="34" cy="94" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="218" cy="116" r="2.5" fill="#f59e0b" opacity="0.6" />
</svg>
