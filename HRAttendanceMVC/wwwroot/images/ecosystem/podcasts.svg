<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pod-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="pod-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="pod-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="pod-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="pod-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="pod-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#581c87" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="85" r="68" fill="url(#pod-bg)" />
  <circle cx="180" cy="45" r="16" fill="#fae8ff" opacity="0.6" />

  <!-- Base Shadow -->
  <ellipse cx="120" cy="138" rx="55" ry="6" fill="#0f172a" opacity="0.12" />

  <!-- Equalizer Audio Waves (Left Side) -->
  <g transform="translate(48, 85)">
    <rect x="0" y="-12" width="4" height="24" rx="2" fill="url(#pod-purple)" />
    <rect x="8" y="-22" width="4" height="44" rx="2" fill="url(#pod-pink)" />
    <rect x="16" y="-16" width="4" height="32" rx="2" fill="url(#pod-cyan)" />
    <rect x="24" y="-28" width="4" height="56" rx="2" fill="url(#pod-purple)" />
    <rect x="32" y="-10" width="4" height="20" rx="2" fill="url(#pod-pink)" />
  </g>

  <!-- Equalizer Audio Waves (Right Side) -->
  <g transform="translate(156, 85)">
    <rect x="0" y="-10" width="4" height="20" rx="2" fill="url(#pod-pink)" />
    <rect x="8" y="-28" width="4" height="56" rx="2" fill="url(#pod-purple)" />
    <rect x="16" y="-16" width="4" height="32" rx="2" fill="url(#pod-cyan)" />
    <rect x="24" y="-22" width="4" height="44" rx="2" fill="url(#pod-pink)" />
    <rect x="32" y="-12" width="4" height="24" rx="2" fill="url(#pod-purple)" />
  </g>

  <!-- Studio Headphones in Background -->
  <g filter="url(#pod-shadow)">
    <!-- Headband Arc -->
    <path d="M78 86 C78 48 162 48 162 86" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M85 75 C85 54 155 54 155 75" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Ear Cups -->
    <rect x="72" y="76" width="12" height="26" rx="6" fill="url(#pod-purple)" stroke="#334155" stroke-width="2" />
    <rect x="156" y="76" width="12" height="26" rx="6" fill="url(#pod-purple)" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Professional Studio Microphone (Center) -->
  <g transform="translate(120, 85)" filter="url(#pod-shadow)">
    <!-- Stand Base -->
    <path d="M-22 50 L22 50 C24 50 26 48 24 46 L18 43 L-18 43 L-24 46 C-26 48 -24 50 -22 50 Z" fill="#334155" />
    <!-- Stand Stem -->
    <rect x="-3" y="14" width="6" height="32" rx="2" fill="url(#pod-silver)" stroke="#64748b" stroke-width="1" />
    <circle cx="0" cy="22" r="5" fill="#475569" />

    <!-- U-Shaped Shockmount Arm -->
    <path d="M-18 -2 C-18 20 18 20 18 -2" stroke="#64748b" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="-18" cy="-2" r="3" fill="#334155" />
    <circle cx="18" cy="-2" r="3" fill="#334155" />

    <!-- Microphone Capsule Body -->
    <rect x="-14" y="-38" width="28" height="46" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Top Grille Gradient -->
    <rect x="-13" y="-37" width="26" height="26" rx="13" fill="url(#pod-purple)" />
    <!-- Mesh Texture Lines -->
    <line x1="-10" y1="-26" x2="10" y2="-26" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <line x1="-11" y1="-21" x2="11" y2="-21" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <line x1="-10" y1="-16" x2="10" y2="-16" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-34" x2="0" y2="-12" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <!-- Metal Mid-Band -->
    <rect x="-14" y="-12" width="28" height="4" fill="#64748b" />
    <!-- Lower Body -->
    <rect x="-13" y="-8" width="26" height="15" rx="2" fill="url(#pod-silver)" />
    <!-- Power / Mute LED -->
    <circle cx="0" cy="0" r="2" fill="#22c55e" />
  </g>

  <!-- "ON AIR" Pill Badge (top-left) -->
  <g transform="translate(34, 30)" filter="url(#pod-shadow)">
    <rect x="0" y="0" width="54" height="20" rx="10" fill="#dc2626" />
    <!-- Red blinking dot -->
    <circle cx="10" cy="10" r="3.5" fill="#ffffff" />
    <!-- ON AIR text bars -->
    <rect x="17" y="8" width="8" height="4" rx="1" fill="#ffffff" />
    <rect x="28" y="8" width="18" height="4" rx="1" fill="#ffffff" />
  </g>

  <!-- Floating Audio Notes / Sparkles -->
  <g fill="#9333ea">
    <!-- Mini Musical Note -->
    <path d="M196 28 L196 42 A4 4 0 1 1 192 38 L192 32 L206 28 L206 38 A4 4 0 1 1 202 34 L202 26 Z" opacity="0.8" />
  </g>
  <path d="M214 62 Q215 65 218 66 Q215 67 214 70 Q213 67 210 66 Q213 65 214 62 Z" fill="#ec4899" />
  <circle cx="42" cy="120" r="3" fill="#06b6d4" opacity="0.7" />
</svg>
