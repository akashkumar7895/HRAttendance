<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="acad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <linearGradient id="acad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="acad-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="acad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="acad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="acad-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#581c87" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="85" r="65" fill="url(#acad-bg)" />
  <circle cx="175" cy="45" r="18" fill="#fef3c7" opacity="0.6" />

  <!-- Laptop Base Shadow -->
  <ellipse cx="120" cy="132" rx="68" ry="7" fill="#0f172a" opacity="0.12" />

  <!-- Laptop Screen Outer Body -->
  <g filter="url(#acad-shadow)">
    <rect x="58" y="42" width="124" height="78" rx="8" fill="#1e293b" />
    <!-- Screen Inner Display -->
    <rect x="63" y="47" width="114" height="68" rx="5" fill="url(#acad-screen)" />
    
    <!-- Video Player UI on Screen -->
    <!-- Top Bar -->
    <rect x="69" y="52" width="28" height="4" rx="2" fill="#818cf8" opacity="0.8" />
    <circle cx="167" cy="54" r="2.5" fill="#f43f5e" />
    <circle cx="160" cy="54" r="2.5" fill="#fbbf24" />
    <circle cx="153" cy="54" r="2.5" fill="#34d399" />

    <!-- Video Play Circle Button -->
    <circle cx="120" cy="77" r="14" fill="url(#acad-purple)" />
    <polygon points="117,71 126,77 117,83" fill="#ffffff" />

    <!-- Code / Course Lines -->
    <rect x="71" y="65" width="22" height="3" rx="1.5" fill="#6366f1" opacity="0.5" />
    <rect x="71" y="72" width="16" height="3" rx="1.5" fill="#6366f1" opacity="0.5" />
    <rect x="148" y="85" width="22" height="3" rx="1.5" fill="#38bdf8" opacity="0.5" />

    <!-- Progress Scrubber Bar -->
    <rect x="69" y="103" width="102" height="3.5" rx="1.75" fill="#4338ca" />
    <rect x="69" y="103" width="58" height="3.5" rx="1.75" fill="url(#acad-gold)" />
    <circle cx="127" cy="104.75" r="3" fill="#ffffff" />
  </g>

  <!-- Laptop Keyboard Base -->
  <path d="M46 120 L194 120 L184 128 C182 130 178 131 174 131 L66 131 C62 131 58 130 56 128 Z" fill="#334155" />
  <path d="M98 122 L142 122 L140 126 L100 126 Z" fill="#475569" />

  <!-- Graduation Cap (floating top-left) -->
  <g transform="translate(42, 20)">
    <!-- Cap Diamond -->
    <polygon points="26,10 52,20 26,30 0,20" fill="url(#acad-purple)" />
    <!-- Cap Skull Base -->
    <path d="M12 25 L12 34 C12 39 26 42 26 42 C26 42 40 39 40 34 L40 25" fill="#581c87" />
    <!-- Cap Button & Tassel -->
    <circle cx="26" cy="20" r="2.5" fill="url(#acad-gold)" />
    <path d="M26 20 C34 22 42 28 44 36" stroke="url(#acad-gold)" stroke-width="2" fill="none" stroke-linecap="round" />
    <polygon points="41,36 47,36 45,43 43,43" fill="url(#acad-gold)" />
  </g>

  <!-- Certificate / Award Badge (floating right) -->
  <g transform="translate(170, 24)" filter="url(#acad-shadow)">
    <!-- Ribbons -->
    <polygon points="12,24 5,42 16,37 27,42 20,24" fill="#be185d" />
    <polygon points="12,24 8,40 16,36 24,40 20,24" fill="#e11d48" />
    <!-- Medal Circle -->
    <circle cx="16" cy="16" r="14" fill="url(#acad-gold)" />
    <circle cx="16" cy="16" r="11" fill="#fef3c7" />
    <!-- Star on Medal -->
    <polygon points="16,8 18.5,13.5 24.5,14 20,18 21.5,24 16,21 10.5,24 12,18 7.5,14 13.5,13.5" fill="url(#acad-gold)" />
  </g>

  <!-- Sparkles / Stars -->
  <g fill="#f59e0b">
    <path d="M110 32 Q112 37 117 39 Q112 41 110 46 Q108 41 103 39 Q108 37 110 32 Z" />
    <path d="M205 92 Q206 95 209 96 Q206 97 205 100 Q204 97 201 96 Q204 95 205 92 Z" transform="scale(0.8)" />
  </g>
  <circle cx="36" cy="98" r="3" fill="#a855f7" opacity="0.6" />
  <circle cx="210" cy="70" r="2.5" fill="#38bdf8" opacity="0.6" />
</svg>
